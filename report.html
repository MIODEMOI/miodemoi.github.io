<style>
:root{--bg:#f6f3ee;--paper:#fff;--ink:#1d1a17;--sub:#5c544c;--muted:#857b71;--accent:#8a6f57;--line:#ece6de;--soft:#f8f5f1;--good:#2f7d6b;--bad:#b4533f}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.02em;word-break:keep-all;padding-bottom:92px;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding:0 18px}
.cover{padding:36px 2px 8px}
.brand{font-size:12px;font-weight:700;letter-spacing:.3em;color:var(--accent)}
.cover h1{font:500 34px/1.15 "Cormorant Garamond",Georgia,serif;margin:12px 0 6px;letter-spacing:0}
.cover .line{display:none}
.cover p{margin:0;color:var(--sub);font-size:15px}
.cover #date{font-size:13px;color:var(--muted);margin-top:2px}
.brand-cat{padding:16px 0;border-top:1px solid var(--line)}.brand-cat:first-of-type{border-top:0;padding-top:4px}
.brand-cat h4{margin:0 0 10px;font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:800}
.bl-list{display:flex;flex-direction:column;gap:8px}.bl-list div{background:#faf6f1;border-radius:12px;padding:11px 14px}.bl-list b{font-size:15.5px;letter-spacing:-.02em}.bl-list small{display:block;font-size:13px;color:var(--sub);margin-top:3px;line-height:1.5}
.chipline{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}.chipline span{font-size:12px;font-weight:700;letter-spacing:.04em;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:#faf6f1}
.si{border-top:1px solid var(--line);padding:16px 0 4px;text-align:center}.si img{width:64%;max-width:260px;aspect-ratio:3/4;object-fit:cover;border-radius:14px;display:block;margin:0 auto 12px;background:#f3eee8}
.si b{display:block;font-size:16px;letter-spacing:-.02em;line-height:1.4}.si .sb p:not(.k){font-size:14px;color:var(--sub);line-height:1.65;margin:8px 0 0}.si a{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;color:var(--accent);text-decoration:none}
.sec-h{margin:34px 2px 14px}
.sec-h small{display:block;font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:700;margin-bottom:4px}
.sec-h h2{margin:0;font-size:23px;font-weight:800;letter-spacing:-.04em;line-height:1.3}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px 20px;margin-bottom:14px}
.k{font-size:12px;letter-spacing:.1em;color:var(--accent);font-weight:800;margin:0 0 8px}
.big{font:800 24px/1.35 "Pretendard",sans-serif;letter-spacing:-.04em;margin:0}
.big.ko{font:800 24px/1.35 "Pretendard",sans-serif}
.sub{color:var(--sub);font-size:15px;margin-top:4px}
.desc{font-size:15.5px;line-height:1.75;margin:8px 0 0;color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:15.5px;margin-top:14px}
.tbl th{text-align:left;color:var(--muted);font-weight:600;width:112px;padding:12px 0;border-top:1px solid var(--line);vertical-align:top;font-size:14px}
.tbl td{padding:12px 0;border-top:1px solid var(--line);font-weight:600}
.grey{display:flex;gap:4px;margin-top:6px}
.grey i{flex:1;height:38px;border-radius:6px;position:relative;border:1px solid var(--line)}
.grey i.on{outline:2.5px solid var(--ink);outline-offset:2px}
.glab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:8px}
.notes{list-style:none;margin:0;padding:0;counter-reset:n}
.notes li{position:relative;padding:12px 0 12px 30px;border-top:1px solid var(--line);font-size:15.5px;line-height:1.7}
.notes li:first-child{border-top:0;padding-top:4px}
.notes li:before{counter-increment:n;content:counter(n);position:absolute;left:0;top:14px;width:20px;height:20px;border-radius:50%;background:var(--soft);color:var(--accent);font-size:11.5px;font-weight:800;display:grid;place-items:center}
.notes li:first-child:before{top:6px}
.tees{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tees figure{margin:0;text-align:center;font-size:12.5px;color:var(--sub);font-weight:600}
.tees img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:12px;background:var(--soft);transition:filter .3s}
.bw .tees img{filter:grayscale(1)}
.tog{display:flex;background:var(--soft);border-radius:12px;padding:4px;margin-top:14px}
.tog button{flex:1;border:0;background:none;border-radius:9px;padding:10px;font:inherit;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer}
.tog button.on{background:var(--ink);color:#fff}
.combo h4{margin:20px 0 10px;font-size:15px;font-weight:800}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px}
.pair{text-align:center;font-size:12.5px;color:var(--sub);line-height:1.4}
.pair div{display:flex;height:48px;border-radius:10px;overflow:hidden;border:1px solid var(--line);margin-bottom:6px}
.pair div i{flex:1}
.chips{display:flex;gap:8px;margin-top:10px}
.chips span{flex:1;text-align:center;font-size:12.5px;color:var(--sub)}
.chips span i{display:block;height:50px;border-radius:10px;border:1px solid var(--line);margin-bottom:6px}
.rule{font-size:15px;color:var(--sub);margin:12px 0 0;padding:0;list-style:none;line-height:1.7}
.rule li{padding:4px 0}
.prod{display:flex;gap:16px;align-items:flex-start}
.prod img{width:96px;height:96px;object-fit:cover;border-radius:14px;flex:none;background:var(--soft)}
.prod .ph{width:96px;height:96px;border-radius:14px;flex:none;background:var(--soft);display:grid;place-items:center;font-size:28px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--soft);border-radius:6px;padding:2px 8px;margin-bottom:6px}
.prod b{display:block;font-size:16.5px;line-height:1.4;font-weight:800}
.prod em{display:block;font-style:normal;color:var(--muted);font-size:13.5px;margin-top:2px}
.prod p{margin:8px 0 0;font-size:14.5px;line-height:1.65;white-space:pre-line;color:var(--sub)}
.shade{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:3px 10px}
.face{display:flex;gap:16px;align-items:stretch;margin-top:16px}
.thirds{width:92px;flex:none;display:flex;flex-direction:column;gap:4px}
.thirds div{background:var(--soft);border-radius:8px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:12px;color:var(--sub);padding:6px 0}
.thirds div.long{background:var(--accent);color:#fff}
.thirds b{font-size:16px}
.fbars{flex:1;font-size:14.5px}
.fbars .r{padding:9px 0;border-top:1px solid var(--line)}
.fbars .r:first-child{border-top:0;padding-top:0}
.bar{height:7px;background:var(--soft);border-radius:9px;margin-top:7px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:9px}
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.cols{display:grid;grid-template-columns:1fr;gap:16px}
.cols h4{margin:0 0 8px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.cols > div:first-child h4:before{content:"✓";width:22px;height:22px;border-radius:50%;background:#e6f2ee;color:var(--good);display:grid;place-items:center;font-size:12px}
.cols > div:nth-child(2) h4:before{content:"✕";width:22px;height:22px;border-radius:50%;background:#f8e9e5;color:var(--bad);display:grid;place-items:center;font-size:11px}
.cols > div + div{border-top:1px solid var(--line);padding-top:16px}
.cols ul{margin:0;padding:0 0 0 30px;font-size:15.5px;line-height:1.7}
.cols li{margin:4px 0}
.shop a{color:var(--ink)}.shop a.btn{color:#fff}
.btn{display:block;text-align:center;background:var(--ink);color:#fff;text-decoration:none;border-radius:14px;padding:15px;font-weight:700;font-size:15.5px;margin-top:14px}
.types{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.3}
.types svg{width:100%;height:44px}
.types .on{color:var(--ink);font-weight:800}
.types .on svg *{stroke:var(--accent);stroke-width:3.2}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px;text-align:center}
.mgrid div{background:var(--soft);border-radius:12px;padding:10px 2px}
.mgrid small{display:block;font-size:12px;color:var(--muted)}
.mgrid b{font-size:18px;font-weight:800}
.bal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px;text-align:center}
.bal div{border:1px solid var(--line);border-radius:12px;padding:10px 2px}
.bal b{font-size:22px;font-weight:800;display:block}
.bal small{font-size:12px;color:var(--muted)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.gal figure{margin:0;font-size:13px;color:var(--sub);text-align:center}
.gal img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:var(--soft)}
.gal.two{grid-template-columns:1fr 1fr;gap:14px}
.gal.two figure{text-align:left;font-size:14px;line-height:1.6;color:var(--ink)}
.gal.two figcaption{margin-top:6px}
.empty{border:1.5px dashed var(--line);border-radius:12px;aspect-ratio:3/4;display:grid;place-items:center;font-size:12px;color:var(--muted)}
.outro{text-align:center;padding:30px 6px 10px}
.outro h3{font:500 32px "Cormorant Garamond",Georgia,serif;margin:0 0 10px}
.outro p{color:var(--sub);font-size:15px;margin:4px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav div{display:flex;max-width:480px;width:100%}
nav button{flex:1;border:0;background:none;padding:9px 0 11px;font:inherit;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;letter-spacing:-.04em;position:relative}
nav button b{display:block;font-size:11px;font-weight:800;color:#b9aea3;letter-spacing:.06em}
nav button[aria-current="true"]{color:var(--ink);font-weight:800}
nav button[aria-current="true"] b{color:var(--accent)}
nav button[aria-current="true"]:after{content:"";position:absolute;top:0;left:30%;right:30%;height:2.5px;border-radius:2px;background:var(--accent)}
.msg{text-align:center;color:var(--muted);padding:60px 10px;font-size:15px}
[hidden]{display:none!important}
.blur2{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}.bl{position:relative;border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--line)}.bl img{display:block;width:100%}.bl.app{max-width:230px;margin:14px auto 0;border-radius:22px;box-shadow:0 6px 20px rgba(0,0,0,.12)}.lock{position:absolute;right:8px;top:8px;background:rgba(29,26,23,.8);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.pchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px 12px;padding:0 18px}.pchips::-webkit-scrollbar{display:none}.pchips button{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;color:var(--sub);cursor:pointer}.pchips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.pchips small{opacity:.6;margin-left:2px}
.ptbl{width:100%;border-collapse:collapse;margin-top:12px}.ptbl th{text-align:left;font-size:16px;font-weight:800;padding:14px 0;border-top:1px solid var(--line);width:80px;vertical-align:top}.ptbl td{text-align:right;padding:14px 0;border-top:1px solid var(--line);line-height:1.5}.ptbl s{color:var(--muted);font-size:13px}.ptbl .off{display:inline-block;margin-left:6px;font-size:12px;font-weight:800;color:#fff;background:var(--bad);border-radius:6px;padding:1px 6px}.ptbl b{font-size:18px;font-weight:800}.ptbl small{display:block;font-size:13px;color:var(--good);font-weight:700}
.appnote{margin-top:14px;background:var(--soft);border-radius:14px;padding:14px 16px;font-size:14.5px;line-height:1.65;color:var(--sub)}.appnote b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
/* 줄바꿈·정렬 다듬기 */
body{word-break:keep-all;overflow-wrap:break-word;line-break:strict}
p,li,.desc,figcaption,.prod p,.appnote,.tbl td{text-wrap:pretty}
h1,h2,h3,h4,.big,.sec-h h2,.prod b,.cover p{text-wrap:balance}
.gal{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.gal figure{flex:0 0 calc((100% - 20px)/3);text-align:center}
.gal.two{gap:14px}
.gal.two figure{flex:0 0 calc((100% - 14px)/2)}
.gal img,.tees img,.prod img{object-position:center}
.gal figcaption{margin-top:6px;line-height:1.5}
.tees{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.tees figure{flex:0 0 calc((100% - 20px)/3)}
.pairs{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.pair{flex:0 0 calc((100% - 24px)/3)}
.chips{justify-content:center}
.prod{align-items:center}
.prod > div{min-width:0}
.blur2 .bl img,.bl.app img{margin:0 auto}
.outro p{text-wrap:balance}

footer{text-align:center;font-size:12px;color:var(--muted);margin:30px 0 10px;line-height:1.6}
.a2hs{position:fixed;left:12px;right:12px;bottom:84px;z-index:9;background:#2f3d86;color:#fff;border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:13px;line-height:1.5;max-width:456px;margin:0 auto}.a2hs img{width:44px;height:44px;border-radius:10px;flex:none}.a2hs b{display:block;font-size:14px}.a2hs button{border:0;background:#fff;color:#2f3d86;font:inherit;font-weight:800;border-radius:999px;padding:7px 12px;flex:none;cursor:pointer}.a2hs .x{background:none;color:#fff;padding:4px;font-size:18px;font-weight:400}
</style>

<script>
const API="https://script.google.com/macros/s/AKfycbzC3uMvHpAVhUxZLuyWoBnlHcssbV4aX4yrd1lBHf6Lc60PP9bxy-RVViKOVaoUUIjcNQ/exec";
const code=new URLSearchParams(location.search).get('c')||'';
const $=id=>document.getElementById(id);
const tidy=s=>/^\s*(data:|https?:|tel:|mailto:|#|ootd\.html|shopper_)/.test(String(s??''))?String(s??''):String(s??'').replace(/[ \t]+([,.!?)])/g,'$1').replace(/\(\s+/g,'(').replace(/[ \t]{2,}/g,' ').replace(/,(?=[^\s\d])/g,', ');
const esc=s=>tidy(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HEX={'화이트':'#ffffff','오프화이트':'#f7f4ec','아이보리':'#f5efdf','크림':'#f1e7cf','라이트베이지':'#e8dcc7','베이지':'#d8c4a3','카멜':'#b8895a','브라운':'#6b4a35','다크브라운':'#4a3326','카키':'#7a7457','올리브':'#6e6b3d','라이트그레이':'#d5d5d5','그레이':'#9b9b9b','차콜':'#4a4a4c','차콜그레이':'#56575a','블랙':'#151515','네이비':'#1f2a44','라이트블루':'#c9daee','스카이블루':'#a6c8e8','스카이':'#adc4e0','블루':'#5b86c0','코발트블루':'#2f5aa8','핑크':'#f1c3cd','라이트핑크':'#f7dde2','로즈':'#d98a9b','라벤더':'#d8cfec','퍼플':'#8c6bb1','민트':'#cfeadf','그린':'#5f8f6a','레드':'#c0392b','와인':'#6d2232','버건디':'#7a1f2b','옐로우':'#f3dc7a','레몬':'#f6eb9c','오렌지':'#e8964a','코랄':'#f08a7a','실버':'#c9cbd0','골드':'#c9a85a'};
const hex=n=>{n=String(n).trim();const m=n.match(/#[0-9a-f]{3,6}/i);return m?m[0]:(HEX[n.replace(/\s/g,'')]||'#cccccc')};
const cname=n=>String(n).replace(/[:：]?\s*#[0-9a-f]{3,6}/i,'').trim();
const L=a=>(Array.isArray(a)?a:String(a||'').split(/\n/)).map(x=>String(x).trim()).filter(Boolean).reduce((o,x)=>{if(o.length&&/^[,.!?)~]/.test(x))o[o.length-1]+=x;else o.push(x);return o},[]);
const ul=a=>L(a).length?`<ul class="notes">${L(a).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';
const head=(n,en,ko)=>`<div class="sec-h"><small>${n} ${en}</small><h2>${ko}</h2></div>`;
let D=window.DEMO||null;

function grey(v){
  const lv=['고명도','중고명도','중명도','중저명도','저명도'],cells=[0,0,1,2,3,4,4],cols=['#fbfbfb','#e9e9e9','#cfcfcf','#a9a9a9','#7d7d7d','#4e4e4e','#222'];
  const tk=String(v||'').split(/~|-|→/).map(s=>s.replace(/\s/g,'')).map(s=>lv.indexOf(s)).filter(i=>i>=0);
  const lo=Math.min(...tk),hi=Math.max(...tk);
  return `<div class="grey">${cols.map((c,i)=>`<i style="background:${c}" class="${tk.length&&cells[i]>=lo&&cells[i]<=hi?'on':''}"></i>`).join('')}</div><div class="glab"><span>고명도</span><span>중명도</span><span>저명도</span></div>`;
}

Object.assign(TABS,{pcguide:pcGuideTab,pcprod:pcProdTab,pcnext:pcNextTab});
function show(t){
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.t===t));
  $('app').innerHTML=TABS[t]();window.scrollTo(0,0);
  document.querySelectorAll('.pchips button').forEach(b=>b.onclick=()=>{PC=b.dataset.c;const y=window.scrollY;show(PCM?'pcprod':'color');window.scrollTo(0,y)});
  document.querySelectorAll('.tog button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tog button').forEach(x=>x.classList.toggle('on',x===b));$('teeCard').classList.toggle('bw',b.dataset.m==='bw')});
}
const DEF_COMBOS=['화이트+화이트','화이트+베이지','화이트+라이트블루','화이트+블랙','화이트+네이비','핑크+아이보리','핑크+라이트베이지','핑크+라이트그레이','핑크+차콜그레이','핑크+브라운','라이트그레이+화이트','라이트그레이+크림','라이트그레이+라이트블루','라이트그레이+블랙','라이트그레이+차콜그레이'];
const FIXED_F=[
 {sec:'컬러 코디 예시',desc:'',items:[['w_fixed_4_1.jpg',''],['w_fixed_4_2.jpg','상,하의를 화이트로 맞춤'],['w_fixed_4_3.jpg','상의를 블랙으로 맞춤'],['w_fixed_4_4.jpg','상의를 블랙으로 맞춤'],['w_fixed_4_5.jpg',''],['w_fixed_4_6.jpg',''],['w_fixed_4_7.jpg','톤온톤 코디'],['w_fixed_4_8.jpg','톤온톤 코디']]},
 {sec:'퍼스널컬러 활용 예',desc:'',items:[['w_fixed_1_1.jpg?v=2','BEFORE'],['w_fixed_1_2.jpg?v=2','AFTER'],['w_fixed_1_3.jpg?v=2','BEFORE'],['w_fixed_1_4.jpg?v=2','AFTER']]},
 {sec:'자켓 허리선의 중요성',desc:'WORST · 자켓이 허리라인을 가림, 자켓의 단추가 허리선보다 밑이라 이 자켓에는 자켓과 비슷한 길이의 스커트나 쇼츠를 입는 것이 좋음\nBEST · 자켓의 첫 단추가 내 허리선보다 살짝 높고, 루즈한 핏이라 슬림한 핏의 스커트와 입기 좋음',items:[['w_fixed_2_1.jpg?v=2','WORST'],['w_fixed_2_2.jpg?v=2','BEST'],['w_fixed_2_3.jpg?v=2','BEST']]},
 {sec:'팬츠 고르는 방법',desc:'왼쪽 사진: 어깨와 골반에 있는 선은 같은 길이입니다. 이렇게 상하체 밸런스를 맞춰 주시고\n오른쪽 사진을 보시면, 사다리꼴이 그려지죠? 이런 핏의 팬츠를 입으세요. 슬랙스에서도 찾으실 수 있어요!',items:[['w_fixed_3_1.jpg?v=2','BEST'],['w_fixed_3_2.jpg?v=2','BEST'],['w_fixed_3_3.jpg','BEST'],['w_fixed_3_4.jpg','BEST'],['w_fixed_3_5.jpg','BEST']]}];
function addFixed(){if(!D||!/^여/.test(D.sex||''))return;D.styles=D.styles||[];
 FIXED_F.filter(f=>!PCM||/퍼스널컬러|컬러 코디/.test(f.sec)).forEach(f=>{const m=D.styles.find(x=>x.sec===f.sec);if(m&&(m.items||[]).length)return;const g={sec:f.sec,desc:(m&&m.desc)||f.desc,items:f.items.map(([img,cap])=>({img,cap}))};if(m)Object.assign(m,g);else D.styles.push(g)})}
function start(){
  PCM=/퍼스널컬러/.test(D.kind||'');FC=!PCM&&/패션컨설팅/.test(D.kind||'');D.shop=(D.products||[]).filter(p=>SHOP_CATS.includes(p.cat));D.products=(D.products||[]).filter(p=>!SHOP_CATS.includes(p.cat));addFixed();
  $('who').textContent=PCM?`${D.name||'고객'} 님의 퍼스널컬러 분석`:`${D.name||'고객'} 님을 위한 퍼스널컬러 · 얼굴형 · 체형 분석`;$('date').textContent=D.date||'';
  if(FC){document.querySelector('.cover h1').textContent='Fashion Consulting Report';$('who').textContent=`${D.name||'고객'} 님을 위한 퍼스널컬러 · 얼굴형 · 체형 · 브랜드 컨설팅`;
    document.querySelector('#nav div').innerHTML=['color:퍼스널컬러','face:얼굴형','body:체형','style:스타일','brand:브랜드','shopper:퍼스널쇼퍼'].map((x,i)=>{const [t,n]=x.split(':');return `<button data-t="${t}"${i?'':' aria-current="true"'}><b>0${i+1}</b>${n}</button>`}).join('');}
  if(PCM){document.querySelector('.cover h1').textContent='Personal Color Report';const fem=/^여/.test(D.sex||'');
    document.querySelector('#nav div').innerHTML=`<button data-t="color" aria-current="true"><b>01</b>진단 결과</button><button data-t="pcprod"><b>02</b>${fem?'메이크업':'스킨케어'}</button><button data-t="pcnext"><b>03</b>다음 단계</button>`;}
  $('nav').hidden=false;document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.t));show('color');
}
(async()=>{
  if(D){start();return}
  if(!code){$('app').innerHTML='<p class="msg">미오드모이에서 받은 전용 링크로 들어와 주세요.</p>';return}
  try{const j=await (await fetch(API+'?app=report&k='+encodeURIComponent(code))).json();
    if(j.error){$('app').innerHTML='<p class="msg">링크가 올바르지 않아요.<br>미오드모이에서 받은 링크를 다시 눌러 주세요.</p>';return}
    D=j;start()}catch(e){$('app').innerHTML='<p class="msg">리포트를 불러오지 못했어요. 잠시 후 다시 열어 주세요.</p>'}
})();
</script>
<script>
(function(){
  var K='mio-report';
  try{var q=new URLSearchParams(location.search).get('c');if(q)localStorage.setItem(K,q);else{var s=localStorage.getItem(K);if(s){location.replace(location.pathname+'?c='+encodeURIComponent(s));return}}}catch(e){}
  var ua=navigator.userAgent;
  if(/KAKAOTALK/i.test(ua)){var kd=document.createElement('div');kd.className='a2hs kk';var iosK=/iphone|ipad|ipod/i.test(ua);
    kd.innerHTML='<img src="icon-180.png" alt=""><div style="flex:1"><b>카카오톡 안에서 열렸어요</b>'+(iosK?'사파리로':'크롬으로')+' 열어 홈 화면에 추가하면, 다음부터 카톡에서 링크를 찾지 않아도 바로 열려요.<button class="go" style="margin-top:8px;display:block">'+(iosK?'사파리로':'크롬으로')+' 열기</button><small style="display:block;margin-top:6px;opacity:.8">안 넘어가면 화면의 ⋯ 또는 공유 버튼 → \''+(iosK?'Safari로 열기':'다른 브라우저로 열기')+'\'</small></div><button class="x" aria-label="닫기">✕</button>';
    document.body.appendChild(kd);kd.querySelector('.x').onclick=function(){kd.remove()};
    kd.querySelector('.go').onclick=function(){location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(location.href)};
    return}
  var standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  var seen=false;try{seen=localStorage.getItem(K+'-a2hs')==='1'}catch(e){}
  if(standalone||seen||!new URLSearchParams(location.search).get('c'))return;
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent),deferred=null;
  function box(msg,btn){var d=document.createElement('div');d.className='a2hs';d.innerHTML='<img src="icon-180.png" alt=""><div style="flex:1"><b>홈 화면에 바로가기 만들기</b>'+msg+'</div>'+(btn?'<button class="go">추가</button>':'')+'<button class="x" aria-label="닫기">✕</button>';document.body.appendChild(d);
    d.querySelector('.x').onclick=function(){d.remove();try{localStorage.setItem(K+'-a2hs','1')}catch(e){}};
    if(btn)d.querySelector('.go').onclick=function(){deferred.prompt();deferred.userChoice.then(function(){d.remove();try{localStorage.setItem(K+'-a2hs','1')}catch(e){}})};}
  if(ios){setTimeout(function(){box('아래 <b style="display:inline">공유 버튼(□↑)</b> → <b style="display:inline">홈 화면에 추가</b>를 눌러 주세요.',false)},1200)}
  else{addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;box('앱처럼 바로 열 수 있어요.',true)});
    setTimeout(function(){if(!deferred&&!document.querySelector('.a2hs'))box('브라우저 메뉴(⋮) → <b style="display:inline">홈 화면에 추가</b>를 눌러 주세요.',false)},4000)}
})();
</script>
