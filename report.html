<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="내 이미지 리포트">
<meta name="theme-color" content="#2f3d86">
<link rel="manifest" href="report.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Personal Image Report | 미오드모이</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
:root{--bg:#efe9e1;--paper:#f8f5f0;--ink:#2b2622;--muted:#7a6f66;--accent:#8c7a6b;--line:#ddd3c7;--serif:"Cormorant Garamond",Georgia,serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.02em;word-break:keep-all;padding-bottom:80px}
.wrap{max-width:480px;margin:0 auto;padding:0 16px}
.cover{padding:34px 4px 18px}
.brand{font-size:11px;letter-spacing:.35em;color:var(--muted)}
.cover h1{font:italic 500 34px/1.1 var(--serif);margin:16px 0 8px}
.cover p{margin:0;color:var(--muted);font-size:13px}
.cover .line{width:36px;height:2px;background:var(--accent);margin:12px 0}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:30px 0 12px}
.sec-h small{font-size:11px;letter-spacing:.2em;color:var(--accent);font-weight:700}
.sec-h h2{margin:0;font-size:18px}
.card{background:var(--paper);border-radius:18px;padding:18px;margin-bottom:12px}
.k{font-size:11px;letter-spacing:.18em;color:var(--accent);font-weight:700;margin:0 0 4px}
.big{font:500 26px/1.25 var(--serif);margin:0}
.big.ko{font:700 22px/1.3 "Pretendard",sans-serif}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}
.tbl th{text-align:left;color:var(--muted);font-weight:500;width:34%;padding:9px 0;border-top:1px solid var(--line);vertical-align:top}
.tbl td{padding:9px 0;border-top:1px solid var(--line)}
.grey{display:flex;gap:3px;margin-top:10px}
.grey i{flex:1;height:34px;border-radius:4px;position:relative}
.grey i.on{outline:2px solid var(--ink);outline-offset:2px}
.glab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
.notes{list-style:none;margin:0;padding:0}
.notes li{position:relative;padding:8px 0 8px 18px;border-top:1px solid var(--line);font-size:14px}
.notes li:first-child{border-top:0}
.notes li:before{content:"";position:absolute;left:2px;top:16px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.tees{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tees figure{margin:0;text-align:center;font-size:11px;color:var(--muted)}
.tees img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:10px;background:#efe9e1;transition:filter .3s}
.bw .tees img{filter:grayscale(1)}
.tog{display:flex;background:#e6ded3;border-radius:999px;padding:3px;margin-top:12px}
.tog button{flex:1;border:0;background:none;border-radius:999px;padding:8px;font:inherit;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.tog button.on{background:var(--ink);color:#fff}
.combo{margin-top:12px}
.combo h4{margin:14px 0 8px;font-size:13px}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.pair{text-align:center;font-size:11px;color:var(--muted)}
.pair div{display:flex;height:46px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.pair div i{flex:1}
.chips{display:flex;gap:6px;margin-top:8px}
.chips span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.chips span i{display:block;height:48px;border-radius:8px;border:1px solid var(--line);margin-bottom:4px}
.rule{font-size:13px;color:var(--muted);margin:10px 0 0;padding-left:0;list-style:none}
.rule li{padding:3px 0}
.prod{display:flex;gap:14px;align-items:flex-start}
.prod img{width:92px;height:92px;object-fit:cover;border-radius:12px;flex:none;background:#e6ded3}
.prod .ph{width:92px;height:92px;border-radius:12px;flex:none;background:#e6ded3;display:grid;place-items:center;font-size:26px}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:1px 8px;margin-bottom:4px}
.prod b{display:block;font-size:15px;line-height:1.35}
.prod em{display:block;font-style:normal;color:var(--muted);font-size:12px}
.prod p{margin:6px 0 0;font-size:13px;white-space:pre-line}
.face{display:flex;gap:16px;align-items:stretch;margin-top:14px}
.thirds{width:96px;flex:none;display:flex;flex-direction:column;gap:3px}
.thirds div{background:#d8cbbd;border-radius:6px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:11px;color:#4d433b}
.thirds div.long{background:var(--accent);color:#fff}
.thirds b{font-size:14px}
.fbars{flex:1;font-size:13px}
.fbars .r{padding:7px 0;border-top:1px solid var(--line)}
.fbars .r:first-child{border-top:0}
.bar{height:6px;background:#e6ded3;border-radius:9px;margin-top:5px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:9px}
.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);left:33.3%}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.cols h4{margin:0 0 4px;font-size:13px}
.cols ul{margin:0;padding-left:16px;font-size:13px}
.cols li{margin:3px 0}
.shop a{color:var(--ink)}.shop a.btn{color:#fff}
.btn{display:block;text-align:center;background:var(--ink);color:#fff;text-decoration:none;border-radius:14px;padding:14px;font-weight:700;margin-top:12px}
.types{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:12px;text-align:center;font-size:10px;color:var(--muted)}
.types svg{width:100%;height:46px}
.types .on{color:var(--ink);font-weight:800}
.types .on svg *{stroke:var(--ink);stroke-width:3}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px;text-align:center}
.mgrid div{background:#efe9e1;border-radius:10px;padding:8px 2px}
.mgrid small{display:block;font-size:11px;color:var(--muted)}
.mgrid b{font-size:16px}
.bal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;text-align:center}
.bal div{border:1px solid var(--line);border-radius:10px;padding:8px 2px}
.bal b{font:500 24px var(--serif);display:block}
.bal small{font-size:11px;color:var(--muted)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.gal figure{margin:0;font-size:11px;color:var(--muted);text-align:center}
.gal img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:#e6ded3}
.empty{border:1.5px dashed var(--line);border-radius:10px;aspect-ratio:3/4;display:grid;place-items:center;font-size:11px;color:var(--muted)}
.desc{font-size:14px;margin:4px 0 0}
.outro{text-align:center;padding:30px 10px 10px}
.outro h3{font:italic 500 30px var(--serif);margin:0 0 8px}
.outro p{color:var(--muted);font-size:13px;margin:4px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav div{display:flex;max-width:480px;width:100%}
nav button{flex:1;border:0;background:none;padding:10px 0 12px;font:inherit;font-size:11px;letter-spacing:-.04em;color:var(--muted);cursor:pointer}
nav button b{display:block;font:italic 500 18px/1.2 var(--serif)}
nav button[aria-current="true"]{color:var(--ink);font-weight:700}
.msg{text-align:center;color:var(--muted);padding:60px 10px}
[hidden]{display:none!important}
.blur2{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}.bl{position:relative;border-radius:12px;overflow:hidden;background:#fff}.bl img{display:block;width:100%}.bl.app{max-width:220px;margin:12px auto 0;border-radius:22px;box-shadow:0 6px 20px rgba(0,0,0,.12)}.lock{position:absolute;right:8px;top:8px;background:rgba(43,38,34,.78);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px}
footer{text-align:center;font-size:11px;color:var(--muted);margin:26px 0 10px}
.a2hs{position:fixed;left:12px;right:12px;bottom:84px;z-index:9;background:#2f3d86;color:#fff;border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:13px;line-height:1.5;max-width:456px;margin:0 auto}.a2hs img{width:44px;height:44px;border-radius:10px;flex:none}.a2hs b{display:block;font-size:14px}.a2hs button{border:0;background:#fff;color:#2f3d86;font:inherit;font-weight:800;border-radius:999px;padding:7px 12px;flex:none;cursor:pointer}.a2hs .x{background:none;color:#fff;padding:4px;font-size:18px;font-weight:400}</style>
</head>
<body>
<div class="wrap">
<header class="cover"><div class="brand">M I O &nbsp;D E &nbsp;M O I</div><h1>Personal Image Report</h1><div class="line"></div><p id="who"></p><p id="date"></p></header>
<main id="app"><p class="msg">리포트를 불러오고 있어요...</p></main>
<footer>© 미오드모이(MIO DE MOI). 고객님 전용 리포트예요.<br>링크를 다른 분께 공유하지 말아 주세요.</footer>
</div>
<nav hidden id="nav"><div>
<button data-t="color" aria-current="true"><b>01</b>퍼스널컬러</button>
<button data-t="face"><b>02</b>얼굴형</button>
<button data-t="body"><b>03</b>체형</button>
<button data-t="style"><b>04</b>스타일</button>
<button data-t="shopper"><b>05</b>퍼스널쇼퍼</button>
</div></nav>
<script>
const API="여기에_웹앱_URL";
const code=new URLSearchParams(location.search).get('c')||'';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HEX={'화이트':'#ffffff','오프화이트':'#f7f4ec','아이보리':'#f5efdf','크림':'#f1e7cf','라이트베이지':'#e8dcc7','베이지':'#d8c4a3','카멜':'#b8895a','브라운':'#6b4a35','다크브라운':'#4a3326','카키':'#7a7457','올리브':'#6e6b3d','라이트그레이':'#d5d5d5','그레이':'#9b9b9b','차콜':'#4a4a4c','차콜그레이':'#56575a','블랙':'#151515','네이비':'#1f2a44','라이트블루':'#c9daee','스카이블루':'#a6c8e8','블루':'#5b86c0','코발트블루':'#2f5aa8','핑크':'#f1c3cd','라이트핑크':'#f7dde2','로즈':'#d98a9b','라벤더':'#d8cfec','퍼플':'#8c6bb1','민트':'#cfeadf','그린':'#5f8f6a','레드':'#c0392b','와인':'#6d2232','버건디':'#7a1f2b','옐로우':'#f3dc7a','레몬':'#f6eb9c','오렌지':'#e8964a','코랄':'#f08a7a','실버':'#c9cbd0','골드':'#c9a85a'};
const hex=n=>{n=String(n).trim();const m=n.match(/#[0-9a-f]{3,6}/i);return m?m[0]:(HEX[n.replace(/\s/g,'')]||'#cccccc')};
const cname=n=>String(n).replace(/[:：]?\s*#[0-9a-f]{3,6}/i,'').trim();
const L=a=>Array.isArray(a)?a.filter(Boolean):String(a||'').split(/\n/).map(x=>x.trim()).filter(Boolean);
const ul=a=>L(a).length?`<ul class="notes">${L(a).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';
const head=(n,en,ko)=>`<div class="sec-h"><small>${n} ${en}</small><h2>${ko}</h2></div>`;
let D=window.DEMO||null;

function grey(v){
  const lv=['고명도','중고명도','중명도','중저명도','저명도'],cells=[0,0,1,2,3,4,4],cols=['#fbfbfb','#e9e9e9','#cfcfcf','#a9a9a9','#7d7d7d','#4e4e4e','#222'];
  const tk=String(v||'').split(/~|-|→/).map(s=>s.replace(/\s/g,'')).map(s=>lv.indexOf(s)).filter(i=>i>=0);
  const lo=Math.min(...tk),hi=Math.max(...tk);
  return `<div class="grey">${cols.map((c,i)=>`<i style="background:${c}" class="${tk.length&&cells[i]>=lo&&cells[i]<=hi?'on':''}"></i>`).join('')}</div><div class="glab"><span>고명도</span><span>중명도</span><span>저명도</span></div>`;
}
function colorTab(){
  const C=D.color||{};
  const rows=[['명도',C.value],['채도',C.chroma],['대비감',C.contrast],['피할 컬러',C.avoid],['액세서리 · 안경테',C.acc]].filter(r=>r[1]);
  const groups={};L(C.combos).forEach(p=>{const [a,b]=p.split('+').map(s=>s.trim());if(!a||!b)return;(groups[cname(a)]=groups[cname(a)]||[]).push([a,b])});
  const tees=(C.tees||[]).filter(t=>t.img);
  return head('01','PERSONAL COLOR','퍼스널컬러 진단 결과')+
  `<div class="card"><p class="k">MAIN</p><p class="big ko">${esc(C.main)}</p>${C.sub?`<p class="sub">SUB · ${esc(C.sub)}</p>`:''}
   <p class="k" style="margin-top:16px">MY GREYSCALE</p>${grey(C.value)}
   <table class="tbl">${rows.map(r=>`<tr><th>${esc(r[0])}</th><td>${esc(r[1])}</td></tr>`).join('')}</table></div>`+
  (L(C.notes).length?`<div class="card"><p class="k">CONSULTANT NOTE</p>${ul(C.notes)}</div>`:'')+
  (tees.length?`<div class="card" id="teeCard"><p class="k">흑백 모드로 찾는 내 티셔츠 컬러</p><p class="desc">흑백으로 바꿔 봤을 때 밝기가 비슷하면 나에게 맞는 명도예요.</p>
   <div class="tog"><button class="on" data-m="c">컬러</button><button data-m="bw">흑백 모드</button></div>
   <div class="tees">${tees.map(t=>`<figure><img src="${esc(t.img)}" alt="${esc(t.n)}" loading="lazy" referrerpolicy="no-referrer"><figcaption>${esc(t.n)}</figcaption></figure>`).join('')}</div>${C.teeNote?`<p class="desc" style="margin-top:10px">${esc(C.teeNote)}</p>`:''}</div>`:'')+
  head('','COLOR GUIDE','꼭 알아야 할 컬러 코디')+
  `<div class="card"><p class="k">MONOCHROME</p><p class="desc">상·하의를 같은 컬러로 입는 걸 모노크롬 룩이라고 해요.</p>
   <ul class="rule"><li>— 화이트와 블랙은 채도 없이 명도만 있는 무채색이에요. 어울리지 않는 컬러가 없어요.</li><li>— 블랙 + 블랙도 소재가 다르면 질감 때문에 다른 컬러로 보여요. 다른 컬러라고 생각하고 입으세요!</li></ul>
   ${Object.keys(groups).length?`<div class="combo">${Object.entries(groups).map(([g,ps])=>`<h4>${esc(g)} 조합</h4><div class="pairs">${ps.map(([a,b])=>`<div class="pair"><div><i style="background:${hex(a)}"></i><i style="background:${hex(b)}"></i></div>${esc(cname(a))} + ${esc(cname(b))}</div>`).join('')}</div>`).join('')}</div>`:''}</div>`+
  ((L(C.tit).length||L(C.tot).length)?`<div class="card"><p class="k">TONE IN TONE · TONE ON TONE</p>
   ${L(C.tit).length?`<h4 style="margin:8px 0 0;font-size:14px">톤인톤</h4><p class="desc" style="color:var(--muted);font-size:13px">색은 달라도 톤(밝기·선명함)을 맞추는 조합. 흑백 모드로 톤이 비슷한지 체크하세요.</p><div class="chips">${L(C.tit).map(c=>`<span><i style="background:${hex(c)}"></i>${esc(cname(c))}</span>`).join('')}</div>`:''}
   ${L(C.tot).length?`<h4 style="margin:16px 0 0;font-size:14px">톤온톤</h4><p class="desc" style="color:var(--muted);font-size:13px">같은 색 안에서 밝기만 달리하는 조합. 그라데이션을 떠올리면 쉬워요.</p><div class="chips">${L(C.tot).map(c=>`<span><i style="background:${hex(c)}"></i>${esc(cname(c))}</span>`).join('')}</div>`:''}
   <p style="font-size:11px;color:var(--muted);margin:10px 0 0">* 색상 칩은 예시예요.</p></div>`:'')+
  ((D.products||[]).length?head('','SKIN & BASE','스킨케어 · 베이스 추천')+(D.products||[]).map(p=>`<div class="card prod">${p.img?`<img src="${esc(p.img)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:'<div class="ph">🧴</div>'}<div>${p.cat?`<span class="tag">${esc(p.cat)}</span>`:''}<b>${esc(p.name)}</b>${p.brand?`<em>${esc(p.brand)}</em>`:''}${p.how?`<p>${esc(p.how)}</p>`:''}${p.url?`<a class="shop" href="${esc(p.url)}" target="_blank" rel="noopener" style="font-size:12px;color:var(--accent)">구매 링크 →</a>`:''}</div></div>`).join(''):'');
}
function faceTab(){
  const F=D.face||{},f=(F.f||[]).map(Number);const ok=f.length===3&&f.every(x=>x>0);
  let parts='';
  if(ok){const sum=f[0]+f[1]+f[2],mn=Math.min(...f),nm=['상안부','중안부','하안부'],pc=f.map(x=>x/sum*100),long=f.map(x=>x-mn>=1);
    const bal=Math.max(...f)-mn<1;
    parts=`<div class="face"><div class="thirds">${f.map((x,i)=>`<div class="${long[i]?'long':''}" style="flex:${x}"><b>${x}cm</b>${nm[i]}</div>`).join('')}</div>
    <div class="fbars">${f.map((x,i)=>`<div class="r"><b>${nm[i]}</b> ${pc[i].toFixed(1)}% <span style="color:var(--muted);font-size:12px">(${(pc[i]-33.3>=0?'+':'')+(pc[i]-33.3).toFixed(1)}%p)</span>${long[i]?' <span class="tag" style="margin:0 0 0 4px">긴 편</span>':''}<div class="bar"><i style="width:${Math.min(100,pc[i]*2)}%"></i><u style="left:66.6%"></u></div></div>`).join('')}
    <p style="font-size:11px;color:var(--muted);margin:6px 0 0">세로선은 이상 비율 33.3%예요.</p></div></div>
    <p class="desc" style="margin-top:12px">${bal?'세 부위가 고르게 균형 잡힌 얼굴이에요.':esc(nm.filter((_,i)=>long[i]).join(' · '))+'가 가장 짧은 부위보다 1cm 이상 길어요.'}</p>`}
  const S=F.shop||{};
  return head('02','FACE SHAPE','얼굴 비율 분석')+
  `<div class="card"><p class="k">RESULT</p><p class="big ko">${esc(F.type||'')}</p>${parts}</div>`+
  `<div class="card"><div class="cols"><div><h4>추천 헤어</h4><ul>${L(F.hair).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div><h4>피할 헤어</h4><ul>${L(F.avoid).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div></div>`+
  (L(F.balance).length?`<div class="card"><p class="k">BALANCE POINT</p>${ul(F.balance)}</div>`:'')+

(async()=>{

    D=j;start()}catch(e){$('app').innerHTML='<p class="msg">리포트를 불러오지 못했어요. 잠시 후 다시 열어 주세요.</p>'}

<script>
(function(){
  var K='mio-report';
  try{var q=new URLSearchParams(location.search).get('c');if(q)localStorage.setItem(K,q);else{var s=localStorage.getItem(K);if(s){location.replace(location.pathname+'?c='+encodeURIComponent(s));return}}}catch(e){}
  var standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  var seen=false;try{seen=localStorage.getItem(K+'-a2hs')==='1'}catch(e){}
  if(standalone||seen||!new URLSearchParams(location.search).get('c'))return;
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent),deferred=null;
  function box(msg,btn){var d=document.createElement('div');d.className='a2hs';d.innerHTML='<img src="icon-180.png" alt=""><div style="flex:1"><b>홈 화면에 바로가기 만들기</b>'+msg+'</div>'+(btn?'<button class="go">추가</button>':'')+'<button class="x" aria-label="닫기">✕</button>';document.body.appendChild(d);
    d.querySelector('.x').onclick=function(){d.remove();try{localStorage.setItem(K+'-a2hs','1')}catch(e){}};
    if(btn)d.querySelector('.go').onclick=function(){deferred.prompt();deferred.userChoice.then(function(){d.remove();try{localStorage.setItem(K+'-a2hs','1')}catch(e){}})};}
  if(ios){setTimeout(function(){box('아래 <b style="display:inline">공유 버튼(□↑)</b> → <b style="display:inline">홈 화면에 추가</b>를 눌러 주세요.',false)},1200)}
  else{addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;box('앱처럼 바로 열 수 있어요.',true)});
    setTimeout(function(){if(!deferred&&!document.querySelector('.a2hs'))box('브라우저 메뉴(⋮) → <b style="display:inline">홈 화면에 추가</b>를 눌러 주세요.',false)},4000)}
})();
</script>
