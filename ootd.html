<script>

async function setBought(k,on){on?BOUGHT.add(k):BOUGHT.delete(k);D.bought=[...BOUGHT];
  try{const r=await fetch(SB+'/rest/v1/rpc/set_purchase',{method:'POST',headers:{apikey:SBKEY,authorization:'Bearer '+SBKEY,'Content-Type':'application/json'},body:JSON.stringify({p_code:code,p_key:k,p_on:on})});if(!r.ok)throw 0}
  catch(e){toast('체크가 저장되지 않았어요. 잠시 후 다시 눌러 주세요.')}}

const code=new URLSearchParams(location.search).get('c')||'';
let D=window.DEMO||null,wxi=null,sit='전체',list=[],idx=0,focus=null,cf='전체';

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));

  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.t===t));

/* 상단 3개월 정리 안내 (미구입 아이템이 있을 때만). NOTI_SKIP = 자동 정리 대상에서 제외한 고객(김경미님) */
const NOTI_SKIP=['nbvc8rkq'];

  const el=$('noti');if(!el)return;
  const hide=()=>{el.hidden=true;el.innerHTML=''};
  if(!D||!Array.isArray(D.bought)||!(D.shop||[]).length)return hide();
  if(NOTI_SKIP.includes(code))return hide();
  if(!$('t-shop').hidden)return hide();
  try{if(sessionStorage.getItem('mio-noti-x-'+code)==='1')return hide()}catch(e){}
  loadBought();
  const un=D.shop.filter(x=>!BOUGHT.has(shopKey(x)));
  if(!un.length)return hide();
  let near=null;un.forEach(x=>{const n=leftDays(x.added);if(n!=null&&(near===null||n<near))near=n});
  el.innerHTML='<button class="nx" aria-label="닫기">✕</button>'
   +'<p>구입 체크하지 않은 옷은 등록일 기준 <b>3개월 후 코디와 함께 삭제</b>돼요.</p>'
   +'<div class="nrow"><span class="nm">미구입 '+un.length+'개'+(near!=null?' · 첫 정리 '+near+'일 뒤':'')+'</span><button class="nb">쇼핑 확인 →</button></div>';
  el.hidden=false;
  el.querySelector('.nb').onclick=()=>tab('shop');
  el.querySelector('.nx').onclick=()=>{hide();try{sessionStorage.setItem('mio-noti-x-'+code,'1')}catch(e){}};
}


function chips(){
  const used=new Set();D.outfits.forEach(o=>o.sit.forEach(s=>used.add(s)));
  const all=['전체',...D.situations.filter(s=>used.has(s))];
  $('sits').innerHTML=all.map(s=>`<button class="chip" aria-pressed="${s===sit}">${esc(s)}</button>`).join('');
  $('sits').querySelectorAll('button').forEach(b=>b.onclick=()=>{sit=b.textContent;focus=null;chips();render(true)});
}

function pick(){
  if(focus&&focus.page)return{l:[focus.page],near:false};
  if(focus)return{l:D.outfits.filter(o=>o.items.includes(focus)),near:false};
  const bySit=D.outfits.filter(o=>sit==='전체'||o.sit.includes(sit));
  if(wxi==null)return{l:bySit,near:false};
  const exact=bySit.filter(o=>!o.wx.length||o.wx.includes(wxi));
  if(exact.length)return{l:exact,near:false};
  return{l:bySit.filter(o=>o.wx.some(w=>Math.abs(w-wxi)===1)),near:true};
}

function render(reshuffle){
  if(!D)return;
  const p=pick();
  if(reshuffle||list.length!==p.l.length||list.some((o,i)=>o!==p.l[i])){list=p.l.slice();idx=0}
  const fb=focus?`<div class="focus"><span>${focus.page?'📖 '+esc(focus.page.name||'스타일링북'):'👕 '+esc(D.items[focus].name)+' 코디 '+list.length+'개'}</span><button id="unf">오늘 코디로</button></div>`:'';
  if(!list.length){$('out').innerHTML=fb+'<div class="card"><p class="msg">조건에 맞는 코디가 아직 없어요.<br>다른 상황을 골라 보시거나 미오드모이에 물어봐 주세요.</p></div>';bindUnf();return}
  const R=[[28,99],[23,27],[17,22],[12,16],[5,11],[-99,4]];
  const temp=o=>{const w=(o.wx||[]).filter(x=>R[x]);if(!w.length)return '<span class="tp">🌡 모든 기온</span>';const lo=Math.min(...w.map(x=>R[x][0])),hi=Math.max(...w.map(x=>R[x][1]));return `<span class="tp">🌡 ${lo<=-99?hi+'° 이하':hi>=99?lo+'° 이상':lo+'~'+hi+'°'}</span>`};
  const {ord,keys}=mkKeys(D.outfits.filter(x=>x.photos),D.shop);
  const title=(o,k)=>{const w=sit!=='전체'?sit:(o.sit&&o.sit[0]);return o.name?(w&&!String(o.name).includes(w)?w+' · '+o.name:o.name):(w?w+' 코디 '+(k+1):'오늘의 코디 '+(k+1))};
  const card=(o,k)=>{const its=(o.items||[]).map(id=>[id,D.items[id]]).filter(x=>x[1]);return `<div class="card">
   <div class="tags">${o.sit.map(x=>`<span>${esc(x)}</span>`).join('')}</div>
   <h3>${esc(title(o,k))}</h3>${o.photos&&keys(o).length?`<div class="key"><small>포인트 아이템</small>${keys(o).map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}
   <div class="meta">${temp(o)}${szTag(o.season)}${o.photos&&o.round!=null?`<span class="rn">${o.round===0?'기존 옷':o.round===LATEST?'이번 쇼핑':o.round+'회차 쇼핑'}</span>`:''}</div>
   ${String(o.tip||'').trim()?`<div class="tips"><p>STYLING TIP</p><div class="tb">${String(o.tip).split(/\n/).map(x=>x.trim()).filter(Boolean).map(x=>`<div class="tip"><i>✓</i><span>${esc(x)}</span></div>`).join('')}</div><button class="more" hidden>더 보기 ▾</button></div>`:''}
   ${o.photos?`<div class="bw"><div class="book ${o.photos.length===1?'one':''}">${ord(o.photos).map(u=>`<img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer">`).join('')}</div>${list.length>1?`<button class="ar l" id="prev" aria-label="이전 코디" ${idx===0?'disabled':''}>‹</button><button class="ar r" id="next" aria-label="다음 코디" ${idx===list.length-1?'disabled':''}>›</button><span class="cnt">${idx+1} / ${list.length}</span>`:''}</div>`:`<div class="grid ${its.length>4?'three':''}">${its.map(([id,i])=>tile(id,i)).join('')}</div>`}
  </div>`};
  idx=Math.max(0,Math.min(idx,list.length-1));
  const nav=list.length>1&&!list[idx].photos?`<div class="pager"><button class="pv" id="prev" ${idx===0?'disabled':''}>◀ 이전</button><span><b>${idx+1}</b> / ${list.length}</span><button class="pv" id="next" ${idx===list.length-1?'disabled':''}>다음 ▶</button></div>`:'';
  $('out').innerHTML=fb+(p.near?'<p class="note" style="margin:0 2px 10px">오늘 기온과 딱 맞는 코디가 없어 가장 가까운 코디를 보여드려요.</p>':'')+(list.length>1?`<p class="note" style="margin:0 2px 10px">오늘 입기 좋은 코디 ${list.length}개 · 사진 양옆 화살표로 넘겨 보세요</p>`:'')+card(list[idx],idx)+nav;
  const go=d=>{idx+=d;render()};
  [list[idx+1],list[idx-1]].forEach(n=>n&&n.photos&&n.photos.forEach(u=>{const im=new Image();im.referrerPolicy='no-referrer';im.src=u}));
  $('out').querySelectorAll('.tips').forEach(t=>{const b=t.querySelector('.tb'),m=t.querySelector('.more');if(b.scrollHeight>b.clientHeight+4){m.hidden=false;m.onclick=()=>{const o=t.classList.toggle('open');m.textContent=o?'접기 ▴':'더 보기 ▾'}}});
  if($('prev'))$('prev').onclick=()=>go(-1);if($('next'))$('next').onclick=()=>go(1);
  $('out').querySelectorAll('.it').forEach(b=>b.onclick=()=>{focus=b.dataset.id;render(true)});
  bindUnf();
}
function bindUnf(){if($('unf'))$('unf').onclick=()=>{focus=null;render(true)}}

function closet(){
  if(D.book){const P=D.outfits.filter(o=>o.photos);const KK=mkKeys(P,D.shop);const cover=o=>KK.ord(o.photos)[0];const n=P.filter(o=>LATEST&&+o.round===LATEST).length;
    document.querySelector('#t-closet h2').firstChild.textContent='스타일링북 ';$('cnt').textContent=`${P.length}페이지${n?' · 이번 쇼핑 '+n:''}`;$('cf').innerHTML='';$('cnote').textContent='페이지를 누르면 크게 볼 수 있어요.';
    $('closet').innerHTML=`<div class="grid">${P.map((o,i)=>`<button class="pg" data-pg="${i}">${LATEST&&+o.round===LATEST?'<span class="badge new">NEW</span>':''}${o.photos[0]?`<img src="${esc(cover(o))}" alt="" loading="lazy" referrerpolicy="no-referrer">`:''}<div><span class="pgt">${esc(KK.keys(o)[0]||o.name||'코디 '+(i+1))}</span>${szTag(o.season)}</div></button>`).join('')}</div><a class="btn ghost" style="margin-top:16px" href="stylebook.html?c=${encodeURIComponent(code)}" target="_blank" rel="noopener">스타일링북 한 번에 보기 · PDF 저장</a>`;
    $('closet').querySelectorAll('.pg').forEach(b=>b.onclick=()=>{focus={page:P[+b.dataset.pg]};tab('today');render(true)});return}
  const ids=Object.keys(D.items);
  const n=ids.filter(id=>isNew(D.items[id])).length;
  $('cnt').textContent=`${ids.length}벌 · 이번 쇼핑 ${n}벌`;
  const has=g=>ids.some(id=>grp(D.items[id])===g);
  $('cf').innerHTML=['전체','이번 쇼핑','지난 쇼핑','기존 옷'].filter(g=>g==='전체'||has(g)).map(s=>`<button class="chip" aria-pressed="${s===cf}">${s}</button>`).join('');
  $('cf').querySelectorAll('button').forEach(b=>b.onclick=()=>{cf=b.textContent;closet()});
  const show=ids.filter(id=>cf==='전체'||grp(D.items[id])===cf);
  const kinds=[...KINDS,...new Set(show.map(id=>D.items[id].kind).filter(k=>!KINDS.includes(k)))];
  $('closet').innerHTML=kinds.map(k=>{const g=show.filter(id=>D.items[id].kind===k);return g.length?`<h2>${esc(k)} <small style="color:var(--muted);font-weight:400">${g.length}</small></h2><div class="grid three">${g.map(id=>tile(id,D.items[id])).join('')}</div>`:''}).join('');
  $('closet').querySelectorAll('.it').forEach(b=>b.onclick=()=>{focus=b.dataset.id;tab('today');render(true)});
}

function shopList(){
  const L=D.shop||[];if(!L.length)return;loadBought();
  const rounds=[...new Set(L.map(x=>+x.round||0))].sort((a,b)=>b-a);
  $('scnt').textContent=L.length+'개';const nb=L.filter(x=>BOUGHT.has(shopKey(x))).length;
  const HB=Array.isArray(D.bought);
  $('shop').innerHTML=(HB?`<p class="buyhint">구입했거나 구입할 옷에 체크해 주세요. <b>${nb}/${L.length}</b><br><small>체크하지 않은 옷은 미구입으로 표시되고, 리스트에 올린 날부터 3개월이 지나면 그 옷이 들어간 코디와 함께 정리돼요.</small></p>`:'')+rounds.map(r=>`${rounds.length>1||r?`<p class="shop-r">${r?r+'회차 쇼핑':'추천'}${r===rounds[0]?' · 최근':''}</p>`:''}`+L.filter(x=>(+x.round||0)===r).map(x=>{const its=(x.items||[]).map(id=>[id,D.items[id]]).filter(y=>y[1]);
    const bk=shopKey(x),on=BOUGHT.has(bk);return `<div class="card sh${on?' got':''}"><div style="display:flex;align-items:center;gap:8px">${x.cat?`<div class="tags" style="flex:1;margin:0"><span>${esc(x.cat)}</span></div>`:'<span style="flex:1"></span>'}${HB?`${on?'':`<span class="nobuy">미구입${dLeft(x.added)}</span>`}<button class="buy${on?' on':''}" data-bk="${esc(bk)}">${on?'✓ 구입 · 구입 예정':'구입 체크'}</button>`:''}</div>
    ${its.length?`<div class="sh-row">${its.map(([id,i])=>`<button class="sh-it" data-id="${esc(id)}"><img src="${esc(i.img)}" alt="" loading="lazy" referrerpolicy="no-referrer"><span>${esc(i.name)}</span></button>`).join('')}</div>`:''}
    ${x.img?`<img class="shimg" src="${esc(x.img)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:''}${x.name?`<b style="display:block;margin-top:4px">${esc(x.name)}</b>`:''}${szTag(x.season)}
    ${String(x.note||'').trim()?`<p class="sh-note">${esc(x.note)}</p>`:''}
    ${x.url?`<a class="btn ghost sm" href="${esc(x.url)}" target="_blank" rel="noopener">상품 페이지 보기 →</a>`:''}</div>`}).join('')).join('');
  $('shop').querySelectorAll('.sh-it').forEach(b=>b.onclick=()=>{focus=b.dataset.id;tab('today');render(true)});
  $('shop').querySelectorAll('.buy').forEach(b=>b.onclick=()=>{const k=b.dataset.bk,on=!BOUGHT.has(k);setBought(k,on);shopList()});
}

function program(){
  const P=D.program;if(!P){$('prog').innerHTML='<p class="msg">프로그램 정보가 아직 없어요.</p>';return}
  const part=(label,x)=>{if(!x||!x.total)return'';const left=x.total-x.used;return`<div class="row"><b>${esc(label)}</b><span class="${left?'':'done'}">${left?`${left}${esc(x.unit)} 남음`:'완료 ✓'} <small style="color:var(--muted)">(${x.used}/${x.total}${esc(x.unit)})</small></span></div><div class="bar"><i style="width:${Math.min(100,x.used/x.total*100)}%"></i></div>`};
  $('prog').innerHTML=`<div class="card"><div class="tags">MY PROGRAM</div><h3>${esc(P.name)}</h3><p class="note" style="margin:0">${(P.parts||[]).map(esc).join(' · ')}${P.price?' · '+esc(P.price):''}</p>
   ${P.body?`<div class="row"><b>체형분석</b><span class="done">완료 ✓</span></div>`:''}
   ${part('오프라인 동행 쇼핑',P.offline)}${P.shopDate?`<p class="note">동행 쇼핑일 ${esc(P.shopDate)}</p>`:''}
   ${part('온라인 쇼핑',P.online)}
   <a class="btn" href="${KAKAO}" target="_blank" rel="noopener">온라인 쇼핑 요청하기 (카카오톡)</a>
   <p class="note">사고 싶은 옷, 필요한 상황을 카톡으로 보내 주시면 고객님 체형과 지금 옷장에 맞춰 골라 드려요. 산 옷은 옷장과 코디에 추가해 드려요.</p></div>`;
}

function start(){
  if(D.draft){program();['closet','shop'].forEach(t=>document.querySelector('nav button[data-t='+t+']').hidden=true);$('sits').innerHTML='';$('out').innerHTML='<div class="card"><p class="msg">미오드모이가 고객님 스타일링북을 만들고 있어요.<br>완성되면 카카오톡으로 알려 드릴게요.</p></div>';return}
  LATEST=Math.max(0,...Object.values(D.items||{}).map(rnd),...(D.outfits||[]).filter(o=>o.photos).map(o=>+o.round||0));
  if(D.book){document.querySelector('nav button[data-t=closet]').lastChild.textContent='스타일링북'}
  chips();closet();shopList();program();noti();
  if(!(D.shop||[]).length)document.querySelector('nav button[data-t=shop]').hidden=true;
  if(D.title)$('ttl').textContent=D.title;
  render(true);
}

(async()=>{
  if(D){start();return}
  if(!code){$('out').innerHTML='<p class="msg">미오드모이에서 받은 전용 링크로 들어와 주세요.</p>';return}
  const CK='mio-ootd-'+code;let cached=null;
  try{cached=localStorage.getItem(CK);if(cached){D=JSON.parse(cached);start()}}catch(e){cached=null}
  try{
    const txt=await sbGet(code);const j=JSON.parse(txt);
    if(j.error){if(!cached)$('out').innerHTML='<p class="msg">링크가 올바르지 않아요.<br>미오드모이에서 받은 링크를 다시 눌러 주세요.</p>';return}
    try{localStorage.setItem(CK,txt)}catch(e){}
    if(txt!==cached){const keep=idx;D=j;start();if(cached){idx=Math.min(keep,Math.max(0,list.length-1));render()}}
  }catch(e){if(!cached)$('out').innerHTML='<p class="msg">코디를 불러오지 못했어요. 잠시 후 다시 열어 주세요.</p>'}
})();
</script>
<script>
(function(){
  var K='mio-ootd';
  try{var q=new URLSearchParams(location.search).get('c');if(q)localStorage.setItem(K,q);else{var s=localStorage.getItem(K);if(s){location.replace(location.pathname+'?c='+encodeURIComponent(s));return}}}catch(e){}
  var ua=navigator.userAgent;
  if(/KAKAOTALK/i.test(ua)){var kd=document.createElement('div');kd.className='a2hs kk';var iosK=/iphone|ipad|ipod/i.test(ua);
    kd.innerHTML='<img src="icon-180.png" alt=""><div style="flex:1"><b>카카오톡 안에서 열렸어요</b>'+(iosK?'사파리로':'크롬으로')+' 열어 홈 화면에 추가하면, 다음부터 카톡에서 링크를 찾지 않아도 바로 열려요.<button class="go" style="margin-top:8px;display:block">'+(iosK?'사파리로':'크롬으로')+' 열기</button><small style="display:block;margin-top:6px;opacity:.8">안 넘어가면 화면의 ⋯ 또는 공유 버튼 → \''+(iosK?'Safari로 열기':'다른 브라우저로 열기')+'\'</small></div><button class="x" aria-label="닫기">✕</button>';
    document.body.appendChild(kd);kd.querySelector('.x').onclick=function(){kd.remove()};
    kd.querySelector('.go').onclick=function(){location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(location.href)};
    return}
  var standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  var seen=false;try{seen=localStorage.getItem(K+'-a2hs')==='1'}catch(e){}
  if(standalone||seen||!new URLSearchParams(location.search).get('c'))return;
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent),deferred=null;
  function box(msg,btn){var d=document.createElement('div');d.className='a2hs';d.innerHTML='<img src="icon-180.png" alt=""><div style="flex:1"><b>홈 화면에 바로가기 만들기</b>'+msg+'</div>'+(btn?'<button class="go">추가</button>':'')+'<button class="x" aria-label="닫기">✕</button>';document.body.appendChild(d);
    d.querySelector('.x').onclick=function(){d.remove();try{localStorage.setItem(K+'-a2hs','1')}catch(e){}};
    if(btn)d.querySelector('.go').onclick=function(){deferred.prompt();deferred.userChoice.then(function(){d.remove();try{localStorage.setItem(K+'-a2hs','1')}catch(e){}})};}
  if(ios){setTimeout(function(){box('아래 <b style="display:inline">공유 버튼(□↑)</b> → <b style="display:inline">홈 화면에 추가</b>를 눌러 주세요.',false)},1200)}
  else{addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;box('앱처럼 바로 열 수 있어요.',true)});
    setTimeout(function(){if(!deferred&&!document.querySelector('.a2hs'))box('브라우저 메뉴(⋮) → <b style="display:inline">홈 화면에 추가</b>를 눌러 주세요.',false)},4000)}
})();
</script>
